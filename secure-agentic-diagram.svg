<svg width="100%" height="100%" viewBox="0 0 680 480" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <style>
      @keyframes pulse  { 0%,100%{opacity:.1} 50%{opacity:.25} }
      @keyframes pulse2 { 0%,100%{opacity:.06} 50%{opacity:.18} }
      @keyframes flow   { to { stroke-dashoffset: -22 } }
      @keyframes glow   { 0%,100%{opacity:.8} 50%{opacity:1} }
      .r1 { animation: pulse  3.2s ease-in-out infinite; }
      .r2 { animation: pulse  3.2s ease-in-out infinite .9s; }
      .r3 { animation: pulse2 3.2s ease-in-out infinite 1.8s; }
      .spoke { stroke-dasharray:4 5; animation: flow 2.2s linear infinite; }
      .core-glow { animation: glow 3s ease-in-out infinite; }
    </style>
    <radialGradient id="core-bg" cx="50%" cy="50%" r="50%">
      <stop offset="0%"   stop-color="#F5C96B" stop-opacity=".22"/>
      <stop offset="55%"  stop-color="#4A96D9" stop-opacity=".18"/>
      <stop offset="100%" stop-color="#1A5FA8" stop-opacity=".05"/>
    </radialGradient>
    <radialGradient id="bg-warm" cx="50%" cy="48%" r="52%">
      <stop offset="0%"   stop-color="#FAC775" stop-opacity=".07"/>
      <stop offset="100%" stop-color="#FAC775" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="node-warm" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#E8943A"/>
      <stop offset="100%" stop-color="#C46E1E"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect x="0" y="0" width="680" height="480" fill="white"/>
  <rect x="0" y="0" width="680" height="480" fill="url(#bg-warm)"/>

  <!-- Concentric rings -->
  <circle cx="340" cy="240" r="175" fill="none" stroke="#378ADD" stroke-width="1"   class="r3"/>
  <circle cx="340" cy="240" r="122" fill="none" stroke="#378ADD" stroke-width="1.2" class="r2"/>
  <circle cx="340" cy="240" r="70"  fill="none" stroke="#FAC775" stroke-width="1"   class="r1"/>

  <!-- Spokes -->
  <line x1="340" y1="170" x2="340" y2="112" stroke="#E8943A" stroke-width="1"   class="spoke" fill="none" opacity=".55"/>
  <line x1="340" y1="310" x2="340" y2="368" stroke="#E8943A" stroke-width="1"   class="spoke" fill="none" opacity=".55"/>
  <line x1="270" y1="240" x2="212" y2="240" stroke="#E8943A" stroke-width="1"   class="spoke" fill="none" opacity=".55"/>
  <line x1="410" y1="240" x2="468" y2="240" stroke="#E8943A" stroke-width="1"   class="spoke" fill="none" opacity=".55"/>

  <!-- Core nucleus -->
  <circle cx="340" cy="240" r="62" fill="url(#core-bg)"/>
  <circle cx="340" cy="240" r="50" fill="#1B5FA8" stroke="#FAC775" stroke-width="1.2" class="core-glow"/>
  <circle cx="340" cy="240" r="50" fill="none" stroke="#F5E9C8" stroke-width="0.5" opacity=".4"/>
  <text font-size="10" font-weight="500" fill="#F5E9C8" x="340" y="228" text-anchor="middle" dominant-baseline="central" font-family="sans-serif">Secure Agentic</text>
  <text font-size="10" font-weight="500" fill="#F5E9C8" x="340" y="243" text-anchor="middle" dominant-baseline="central" font-family="sans-serif">Enterprise</text>
  <text font-size="10" font-weight="500" fill="#F5E9C8" x="340" y="258" text-anchor="middle" dominant-baseline="central" font-family="sans-serif">Architecture</text>

  <!-- AI Governance – top -->
  <circle cx="340" cy="112" r="28" fill="url(#node-warm)" stroke="#FAC775" stroke-width="1"/>
  <text font-size="11" font-weight="500" fill="#FFF3DC" x="340" y="107" text-anchor="middle" dominant-baseline="central" font-family="sans-serif">AI</text>
  <text font-size="11" font-weight="500" fill="#FFF3DC" x="340" y="121" text-anchor="middle" dominant-baseline="central" font-family="sans-serif">Governance</text>

  <!-- Full Auditability – bottom -->
  <circle cx="340" cy="368" r="28" fill="url(#node-warm)" stroke="#FAC775" stroke-width="1"/>
  <text font-size="11" font-weight="500" fill="#FFF3DC" x="340" y="363" text-anchor="middle" dominant-baseline="central" font-family="sans-serif">Full</text>
  <text font-size="11" font-weight="500" fill="#FFF3DC" x="340" y="377" text-anchor="middle" dominant-baseline="central" font-family="sans-serif">Auditability</text>

  <!-- Access Control – left -->
  <circle cx="212" cy="240" r="28" fill="url(#node-warm)" stroke="#FAC775" stroke-width="1"/>
  <text font-size="11" font-weight="500" fill="#FFF3DC" x="212" y="235" text-anchor="middle" dominant-baseline="central" font-family="sans-serif">Access</text>
  <text font-size="11" font-weight="500" fill="#FFF3DC" x="212" y="249" text-anchor="middle" dominant-baseline="central" font-family="sans-serif">Control</text>

  <!-- Data Privacy – right -->
  <circle cx="468" cy="240" r="28" fill="url(#node-warm)" stroke="#FAC775" stroke-width="1"/>
  <text font-size="11" font-weight="500" fill="#FFF3DC" x="468" y="235" text-anchor="middle" dominant-baseline="central" font-family="sans-serif">Data</text>
  <text font-size="11" font-weight="500" fill="#FFF3DC" x="468" y="249" text-anchor="middle" dominant-baseline="central" font-family="sans-serif">Privacy</text>
</svg>
